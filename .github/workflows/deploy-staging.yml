name: Deploy Staging

on:
  push:
    branches: [staging]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: duel
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: duel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U duel -d duel_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Migrations match models (Postgres)
        env:
          SECRET_KEY: ci-only-secret-key-not-used-anywhere-else
          DATABASE_URL: postgresql+asyncpg://duel:ci@localhost:5432/duel_ci
        run: |
          alembic upgrade head
          alembic check
      - name: Run tests (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://duel:ci@localhost:5432/duel_ci
        run: pytest -q
      - name: Docker build check
        run: docker build -t duel-domain-ci .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/Duel_Domain-staging
            git pull origin staging
            docker compose -p duel-domain-staging up -d --build --remove-orphans
            docker image prune -f
