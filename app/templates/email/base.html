<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Duel Domain{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background:#0f1115;font-family:Arial,Helvetica,sans-serif;color:#1f2430;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0f1115;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;">
          <tr>
            <td style="padding:8px 4px 20px;font-size:22px;font-weight:bold;color:#ffffff;letter-spacing:0.5px;">
              DUEL <span style="color:#ff4d4f;">DOMAIN</span>
            </td>
          </tr>
          <tr>
            <td style="background:#ffffff;border-radius:10px;padding:32px 28px;font-size:15px;line-height:1.6;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 4px;font-size:12px;line-height:1.5;color:#8a90a0;">
              Questions? Reply to this email or write to
              <a href="mailto:{{ support_email }}" style="color:#8a90a0;">{{ support_email }}</a>.<br>
              <a href="{{ frontend_url }}" style="color:#8a90a0;">{{ frontend_url }}</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
