{% extends "base.html" %}
{% block title %}New signup{% endblock %}
{% block content %}
<p style="margin:0 0 12px;">A new account was just created on Duel Domain.</p>
<table role="presentation" cellpadding="0" cellspacing="0" style="font-size:14px;">
  <tr><td style="padding:4px 16px 4px 0;color:#5b6170;">Username</td><td style="padding:4px 0;"><strong>{{ username }}</strong></td></tr>
  <tr><td style="padding:4px 16px 4px 0;color:#5b6170;">Email</td><td style="padding:4px 0;">{{ email }}</td></tr>
  <tr><td style="padding:4px 16px 4px 0;color:#5b6170;">User ID</td><td style="padding:4px 0;">{{ user_id }}</td></tr>
</table>
{% endblock %}
