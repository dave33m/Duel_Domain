# Production and staging run from the same file as separate compose projects:
#   docker compose -p duel-domain up -d --build          (APP_PORT=8000 in .env)
#   docker compose -p duel-domain-staging up -d --build  (APP_PORT=8001 in .env)
# Each project gets its own API container, its own Postgres container and its own volumes.
#
# The API listens on localhost only; Caddy on the host terminates HTTPS and proxies to it
# (see scripts/setup_caddy.sh). Docker bypasses ufw for published ports, so binding to
# 127.0.0.1 is what actually keeps the raw port off the internet. Postgres publishes no
# port at all: only the API container can reach it.

services:
  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://duel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/duel_domain}
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-8000}:8000"
    volumes:
      # Former SQLite database; imported into Postgres once on first start, then kept as a backup.
      - data:/app/data
      # Uploaded game banners survive rebuilds and are served from /uploads.
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: duel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: duel_domain
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U duel -d duel_domain"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *logging

volumes:
  data:
  pgdata:
  uploads:
